name: KOReader
options:
  bundleIdPrefix: com.bparker2003
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # The project lives at the repo root so paths in `sources`/`scripts`
  # resolve naturally to the rest of the tree.
  generateEmptyDirectories: true

settings:
  base:
    ENABLE_BITCODE: NO
    # The build phases below shell out to KOReader's Makefile, which reads
    # and writes across SRCROOT and base/. Those accesses cannot be declared
    # as script inputs/outputs, so Xcode's user-script sandbox (default YES
    # since Xcode 26) denies them with "Operation not permitted".
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
    # Skip the simulator slice for now — base/ libs are device-only.
    SUPPORTED_PLATFORMS: iphoneos
    ONLY_ACTIVE_ARCH: YES
    ARCHS: arm64
    VALID_ARCHS: arm64
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # Personal team / free-cert signing: leave team blank so each user
    # can fill it in via the Xcode UI. Manual style avoids the
    # capabilities-spam Xcode does under Automatic.
    CODE_SIGN_STYLE: Automatic
    # Set explicitly so regenerating the project doesn't wipe the team picked
    # in Xcode's UI (xcodegen rewrites project.pbxproj from this file).
    DEVELOPMENT_TEAM: VEU4669KPZ
    PRODUCT_NAME: KOReader
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Lua looks the ko_ios_* functions up at runtime (ffi.C), so nothing refers
    # to them at link time: Release must not hide, drop or strip them.
    GCC_SYMBOLS_PRIVATE_EXTERN: NO
    DEAD_CODE_STRIPPING: NO
    STRIP_INSTALLED_PRODUCT: NO

targets:
  KOReader:
    type: application
    platform: iOS
    sources:
      - path: platform/ios/ios_loader.m
        type: file
      - path: platform/ios/ios_filepicker.m
        type: file
      - path: platform/ios/ios_exit.c
        type: file
      - path: platform/ios/ios_menu.m
        type: file
      - path: platform/ios/ios_location.m
        type: file
      - path: platform/ios/ios_dialog.m
        type: file
      - path: platform/ios/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bparker2003.koreaderios
        INFOPLIST_FILE: platform/ios/Info.plist
        CODE_SIGN_ENTITLEMENTS: platform/ios/KOReader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Header / library search paths point at the `base/build` tree
        # produced by `make TARGET=ios base`. The pre-build script makes
        # sure that's up-to-date before we start compiling.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/base/build/arm64-apple-ios14.0/staging/include
          - $(SRCROOT)/base/build/arm64-apple-ios14.0/staging/include/luajit-2.1
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/base/build/arm64-apple-ios14.0/libs
          - $(SRCROOT)/base/build/arm64-apple-ios14.0/staging/lib
        OTHER_LDFLAGS:
          - -lluajit
          - -lSDL3
          # embed-bundle-payload.sh rewrites the library paths after linking.
          - -Wl,-headerpad_max_install_names
        # rpath so dyld finds the frameworks we embed at post-build.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        # Embedded dylibs need this; iOS 14+ enforces it.
        LD_DYLIB_INSTALL_NAME: ""
        # Quiet the noisy override of macOS-isms.
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreLocation.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build base/ libs and staging tree
        script: |
          set -euo pipefail
          # Xcode strips PATH down to the launchd default, which does NOT
          # contain Homebrew -- so `brew` itself has to be found first, before
          # it can be used to locate the GNU tools KOReader's Makefile needs.
          # (Building from a terminal masks this: the shell's PATH is inherited.)
          export PATH="/opt/homebrew/bin:/usr/local/bin:${PATH}"
          BREW_PREFIX="$(brew --prefix)"
          export PATH="${BREW_PREFIX}/opt/findutils/libexec/gnubin:${BREW_PREFIX}/opt/gnu-getopt/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/opt/util-linux/bin:${PATH}"
          cd "${SRCROOT}"
          # Xcode's INSTALL_DIR points into the archive when archiving, and the
          # Makefile would stage a second copy of the tree there; Xcode then
          # treats the archive as generic and offers no way to distribute it.
          unset INSTALL_DIR
          # `all` (not `base`) so the koreader-ios-…/koreader staging
          # tree gets assembled too — the post-build script rsyncs from
          # there into the .app.
          make TARGET=ios all
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed assets and dylibs
        script: |
          set -euo pipefail
          "${SRCROOT}/platform/ios/embed-bundle-payload.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/app/reader.lua
